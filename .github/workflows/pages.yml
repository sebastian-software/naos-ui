name: Deploy docs and demos to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs and demo site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.13

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native compiler
        run: pnpm build:native

      - name: Check TypeScript packages
        run: pnpm check-types

      - name: Check docs types
        run: pnpm check:docs

      - name: Check demo types
        run: pnpm --filter @naos-ui/example-counter type-check

      - name: Install Playwright Chromium
        run: pnpm --filter @naos-ui/example-counter exec playwright install --with-deps chromium

      - name: Prepare demo DSD
        run: pnpm --filter @naos-ui/example-counter prepare:dsd

      - name: Test demo
        run: pnpm --filter @naos-ui/example-counter exec playwright test --project=chromium

      - name: Build playground assets
        run: pnpm build:playground

      - name: Test the production playground
        run: pnpm --filter @naos-ui/playground-site test:browser

      - name: Build docs site
        run: pnpm build:docs
        env:
          NAOS_GITHUB_PAGES: "true"
          NAOS_SITE_BASE: "/"

      - name: Build demo site
        run: pnpm --filter @naos-ui/example-counter build
        env:
          NAOS_GITHUB_PAGES: "true"
          NAOS_DEMO_BASE: "/demos/"

      - name: Copy demo into docs artifact
        run: |
          mkdir -p sites/docs/build/client/demos
          cp -R examples/counter/dist/. sites/docs/build/client/demos/

      - name: Copy playground into docs artifact
        run: |
          mkdir -p sites/docs/build/client/playground
          cp -R sites/playground/dist/. sites/docs/build/client/playground/

      - name: Add custom domain (CNAME)
        run: echo "naos-ui.dev" > sites/docs/build/client/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: sites/docs/build/client

  deploy:
    name: Deploy docs and demo site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
